
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgraded to be compatible with Gradle 8.5
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    tools = [
            minSdk      : 19,
            targetSdk   : 33,  // Updated for AGP 8.x
            compileSdk  : 33,  // Updated for AGP 8.x
            versionName: '3.2.0-beta.3'
    ]
}
